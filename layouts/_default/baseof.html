<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" class="h-full">
<head>
  {{ partial "head.html" . }}
</head>
<body class="flex flex-col bg-[#FCFBF7] font-bilingual text-[#2a1f18] antialiased">
  <header class="fixed top-0 left-0 z-30 w-full bg-[rgba(252,251,247,0.95)] backdrop-blur-sm border-b border-[rgba(58,46,38,0.12)] shadow-sm">
    <div class="w-full max-w-4xl mx-auto px-6 overflow-x-auto sm:overflow-visible">
      {{ partial "header.html" . }}
    </div>
  </header>

  <div class="flex-1 flex flex-col min-h-screen pt-24 pb-16 md:pb-24">
    <main class="flex-1 w-full max-w-4xl mx-auto px-6 overflow-x-auto sm:overflow-visible">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  <footer class="w-full max-w-4xl mx-auto px-6 overflow-x-auto sm:overflow-visible mt-4 md:mt-8">
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
