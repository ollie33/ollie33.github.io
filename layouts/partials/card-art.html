{{- /*
  首頁 Featured 卡的小插圖。依專案 front matter 的 card_art 選圖：
  flow（AI 導入）、benchmark（虛擬主播）、layers（e-Insure）。
  .art-accent 元素在卡片 hover 時變色（CSS 在 home.html）。
*/ -}}
{{- $kind := . -}}
{{- if eq $kind "flow" -}}
<svg viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Process flow with an AI step and a final human check" class="w-full h-auto">
  <rect x="6" y="42" width="26" height="26" rx="6" fill="#f3ebe4" stroke="#a08874" stroke-width="1.5"/>
  <path d="M12 50h14M12 55h14M12 60h9" stroke="#8a7568" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34 55h8m0 0-3-3m3 3-3 3" stroke="#8a7568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="art-accent" x="44" y="42" width="26" height="26" rx="6" fill="#FEF08A" stroke="#a08874" stroke-width="1.5"/>
  <text x="57" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#2a1f18" font-family="inherit">AI</text>
  <path d="M72 55h8m0 0-3-3m3 3-3 3" stroke="#8a7568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="95" cy="55" r="13" fill="#f3ebe4" stroke="#a08874" stroke-width="1.5"/>
  <path d="m89.5 55 4 4 7-8" stroke="#5c3d2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{{- else if eq $kind "benchmark" -}}
<svg viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of 10 embedding models with the best one highlighted" class="w-full h-auto">
  <rect class="art-accent" x="8"  y="28" width="7" height="64" rx="2" fill="#FEF08A" stroke="#a08874" stroke-width="1.2"/>
  <rect x="18" y="32" width="7" height="60" rx="2" fill="#e5dbd0"/>
  <rect x="28" y="66" width="7" height="26" rx="2" fill="#e5dbd0"/>
  <rect x="38" y="30" width="7" height="62" rx="2" fill="#e5dbd0"/>
  <rect x="48" y="50" width="7" height="42" rx="2" fill="#e5dbd0"/>
  <rect x="58" y="43" width="7" height="49" rx="2" fill="#e5dbd0"/>
  <rect x="68" y="58" width="7" height="34" rx="2" fill="#e5dbd0"/>
  <rect x="78" y="77" width="7" height="15" rx="2" fill="#e5dbd0"/>
  <rect x="88" y="89" width="7" height="3"  rx="2" fill="#e5dbd0"/>
  <rect x="98" y="32" width="7" height="60" rx="2" fill="#e5dbd0"/>
  <path d="M6 94h100" stroke="#a08874" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m8.5 20 1.6 3.4 3.7.5-2.7 2.6.7 3.7-3.3-1.8-3.3 1.8.7-3.7-2.7-2.6 3.7-.5z" fill="#c9a227"/>
</svg>
{{- else if eq $kind "layers" -}}
<svg viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three layers: prompt, dataset, engineering" class="w-full h-auto">
  <rect x="16" y="16" width="80" height="22" rx="6" fill="#f3ebe4" stroke="#a08874" stroke-width="1.5"/>
  <text x="56" y="31" text-anchor="middle" font-size="10" font-weight="600" fill="#6e5a4d" font-family="inherit">Prompt</text>
  <rect class="art-accent" x="16" y="45" width="80" height="22" rx="6" fill="#FEF08A" stroke="#a08874" stroke-width="1.5"/>
  <text x="56" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#2a1f18" font-family="inherit">Data</text>
  <rect x="16" y="74" width="80" height="22" rx="6" fill="#f3ebe4" stroke="#a08874" stroke-width="1.5"/>
  <text x="56" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#6e5a4d" font-family="inherit">Eng</text>
  <circle cx="92" cy="45" r="11" fill="#fffef8" stroke="#5c3d2e" stroke-width="2"/>
  <path d="M100 53l7 7" stroke="#5c3d2e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
{{- end -}}
