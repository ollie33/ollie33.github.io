<script>
  (function () {
    var root = document.querySelector('[data-flow-toggle]');
    if (!root) return;
    var buttons = root.querySelectorAll('.seg-btn');
    var panels = root.querySelectorAll('[data-flow-panel]');
    function show(name) {
      panels.forEach(function (p) { p.hidden = p.getAttribute('data-flow-panel') !== name; });
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-show') === name)); });
    }
    root.querySelectorAll('[data-flow-label]').forEach(function (l) { l.hidden = true; });
    root.querySelector('[data-flow-buttons]').hidden = false;
    buttons.forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-show')); }); });
    show('before');
  })();
</script>
